name: Build & release SmartTube Glass

on:
  push:
    branches: [glass]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'glass/mockup/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: glass-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glass
          fetch-depth: 0
          submodules: recursive

      # gradlew is stored without the exec bit upstream (100644).
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Decide whether to release
        id: guard
        run: |
          if bash glass/scripts/should-release.sh; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Script tests
        if: steps.guard.outputs.skip == 'false'
        run: bash glass/tests/test-scripts.sh

      - name: Compute version
        if: steps.guard.outputs.skip == 'false'
        id: version
        run: |
          UP=$(./gradlew -q :smarttubetv:printGlassVersion | bash glass/scripts/parse-version.sh upstreamVersionName)
          REV=$(git tag -l | bash glass/scripts/next-revision.sh "$UP")
          LINE=$(./gradlew -q :smarttubetv:printGlassVersion -PglassRevision="$REV")
          CODE=$(echo "$LINE" | bash glass/scripts/parse-version.sh versionCode)
          NAME=$(echo "$LINE" | bash glass/scripts/parse-version.sh versionName)
          echo "Building $NAME ($CODE)"
          {
            echo "rev=$REV"
            echo "code=$CODE"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Signing config
        if: steps.guard.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.GLASS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GLASS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLASS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLASS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::signing secrets missing (GLASS_KEYSTORE_BASE64, GLASS_KEYSTORE_PASSWORD, GLASS_KEY_ALIAS, GLASS_KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glass.jks"
          {
            echo "storeFile=$RUNNER_TEMP/glass.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test & build
        if: steps.guard.outputs.skip == 'false'
        run: ./gradlew -PglassRevision=${{ steps.version.outputs.rev }} :smarttubetv:testStglassDebugUnitTest :smarttubetv:assembleStglassRelease

      - name: Collect assets
        if: steps.guard.outputs.skip == 'false'
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          OUT=smarttubetv/build/outputs/apk/stglass/release
          mkdir -p dist
          cp "$OUT/SmartTube_glass_${NAME}_universal.apk" dist/smarttube_glass.apk
          cp "$OUT/SmartTube_glass_${NAME}_arm64-v8a.apk" dist/smarttube_glass_arm64-v8a.apk
          cp "$OUT/SmartTube_glass_${NAME}_armeabi-v7a.apk" dist/smarttube_glass_armeabi-v7a.apk

          UPSTREAM=$(git describe --tags --match '[0-9]*s' --abbrev=0 HEAD 2>/dev/null || echo "(tag upstream introuvable)")
          mapfile -t LINES < <(bash glass/scripts/changelog.sh)
          bash glass/scripts/make-update-json.sh "$NAME" "$CODE" "$REPO" "Upstream $UPSTREAM" "${LINES[@]}" > dist/smarttube_glass.json

          {
            echo "SmartTube Glass $NAME (versionCode $CODE), basée sur SmartTube $UPSTREAM."
            echo
            for l in "${LINES[@]}"; do echo "- $l"; done
          } > dist/notes.md
          ls -l dist

      # The fixed `latest` release (read by the TV) is updated first and the versioned
      # release last: its tag marks HEAD as released, so a failed run can simply be re-run.
      - name: Publish release
        if: steps.guard.outputs.skip == 'false'
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          ASSETS="dist/smarttube_glass.apk dist/smarttube_glass_arm64-v8a.apk dist/smarttube_glass_armeabi-v7a.apk dist/smarttube_glass.json"
          gh release view latest > /dev/null 2>&1 \
            || gh release create latest --target "$(git rev-parse HEAD)" --title "Latest" --notes "Dernière version de SmartTube Glass (lue par la mise à jour intégrée)." --latest=false
          gh release upload latest $ASSETS --clobber
          gh release create "v$NAME" $ASSETS --target "$(git rev-parse HEAD)" --title "SmartTube Glass $NAME" --notes-file dist/notes.md

      - name: Report failure
        if: failure()
        run: |
          bash glass/scripts/open-issue.sh \
            "Build/release échoué : $(git rev-parse --short HEAD)" \
            "Le workflow de build a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
