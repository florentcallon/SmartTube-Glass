name: Sync upstream SmartTube

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The push must use a personal token: GITHUB_TOKEN cannot push commits that touch
      # .github/workflows (upstream does), and its pushes would not trigger build-release.
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.GLASS_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::secret GLASS_SYNC_TOKEN missing (see glass/README.md, Mise en ligne)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: glass
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GLASS_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream --tags --force

      - name: Merge latest stable tag
        id: merge
        run: |
          TAG=$(git tag -l | bash glass/scripts/latest-stable-tag.sh)
          echo "Latest upstream stable: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "Nothing to merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "Merge upstream $TAG" "$TAG"; then
            FILES=$(git diff --name-only --diff-filter=U)
            git merge --abort
            BODY=$(printf 'La fusion de la version stable `%s` de SmartTube dans `glass` a échoué.\n\nFichiers en conflit :\n\n%s\n\nRésolution manuelle : voir glass/README.md, section Synchronisation.' "$TAG" "$(echo "$FILES" | sed 's/^/- /')")
            bash glass/scripts/open-issue.sh "Sync upstream $TAG : conflit" "$BODY"
            exit 1
          fi
          git submodule update --init --recursive
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Check overridden upstream files
        if: steps.merge.outputs.merged == 'true'
        run: |
          set +e
          CHANGED=$(bash glass/scripts/check-overrides.sh)
          CODE=$?
          set -e
          if [ "$CODE" -eq 2 ]; then
            BODY=$(printf 'Ces fichiers SmartTube que le fork remplace ont changé dans `%s`. Notre copie masque ces changements : à comparer et reporter, puis mettre à jour glass/overrides.lock.\n\n%s' "${{ steps.merge.outputs.tag }}" "$(echo "$CHANGED" | sed 's/^/- /')")
            bash glass/scripts/open-issue.sh "Surcharges à revoir après ${{ steps.merge.outputs.tag }}" "$BODY"
          elif [ "$CODE" -ne 0 ]; then
            exit 1
          fi

      - name: List upstream workflow changes
        if: steps.merge.outputs.merged == 'true'
        run: |
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- .github/workflows)
          if [ -n "$CHANGED" ]; then
            BODY=$(printf 'La version `%s` de SmartTube modifie ses workflows. Ceux qui ne servent pas au fork doivent rester désactivés (onglet Actions) :\n\n%s' "${{ steps.merge.outputs.tag }}" "$(echo "$CHANGED" | sed 's/^/- /')")
            bash glass/scripts/open-issue.sh "Workflows SmartTube modifiés dans ${{ steps.merge.outputs.tag }}" "$BODY"
          fi

      # Pushing with the personal token triggers build-release.yml.
      - name: Push
        if: steps.merge.outputs.merged == 'true'
        run: git push origin glass "refs/tags/${{ steps.merge.outputs.tag }}"

      - name: Report failure
        if: failure()
        run: |
          bash glass/scripts/open-issue.sh \
            "Sync upstream : échec" \
            "La synchronisation avec SmartTube a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
